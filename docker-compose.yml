services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: ["mongo_data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
  api:
    build: ./poshanai-backend
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/poshanai
      REDIS_URL: redis://redis:6379
    volumes: ["./poshanai-backend/uploads:/app/uploads"]
    ports: ["4000:4000"]
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_started }
  ocr-worker:
    build: ./poshanai-backend
    command: ["npm", "run", "worker"]
    env_file: .env
    volumes: ["./poshanai-backend/uploads:/app/uploads"]
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_started }
  web:
    build:
      context: .
      dockerfile: poshanai-frontend/Dockerfile
    ports: ["8080:80", "443:443"]
    volumes: ["./nginx/certs:/etc/nginx/certs:ro"]
    depends_on: [api]
volumes:
  mongo_data:
  redis_data:
